<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Shopping Cart</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom CSS for a clean, modern shopping cart */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }

        :root {
            --brand-color: #4f46e5; /* Indigo */
            --brand-color-dark: #4338ca;
        }
        
        .checkout-button {
            background-color: var(--brand-color);
            transition: all 0.3s ease;
        }
        .checkout-button:hover {
            background-color: var(--brand-color-dark);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(79, 70, 229, 0.25);
        }
        
        .quantity-input {
            width: 5rem;
            text-align: center;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold" style="color: var(--brand-color);">ShopCart</div>
            <a href="#" class="text-gray-600 hover:text-gray-900">&larr; Continue Shopping</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-8">Your Cart</h1>
        
        <div class="flex flex-col lg:flex-row gap-12">
            
            <!-- Cart Items (Left) -->
            <div class="w-full lg:w-2/3">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="text-left font-semibold p-4">Product</th>
                                <th class="text-left font-semibold p-4">Price</th>
                                <th class="text-left font-semibold p-4">Quantity</th>
                                <th class="text-left font-semibold p-4">Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <!-- Cart Item 1 -->
                            <tr>
                                <td class="p-4">
                                    <div class="flex items-center space-x-4">
                                        <img src="https://placehold.co/100x100/e0e7ff/4338ca?text=Watch" alt="Product" class="w-20 h-20 rounded-md object-cover">
                                        <div>
                                            <p class="font-semibold text-gray-900">Aura Watch 5</p>
                                            <p class="text-sm text-gray-500">Color: Midnight Black</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4 font-semibold">$399.00</td>
                                <td class="p-4">
                                    <input type="number" value="1" min="1" class="quantity-input rounded-md p-2">
                                </td>
                                <td class="p-4 font-semibold">$399.00</td>
                                <td class="p-4">
                                    <button class="text-gray-400 hover:text-red-500">&times;</button>
                                </td>
                            </tr>
                            
                            <!-- Cart Item 2 -->
                            <tr>
                                <td class="p-4">
                                    <div class="flex items-center space-x-4">
                                        <img src="https://placehold.co/100x100/e0e7ff/4338ca?text=Case" alt="Product" class="w-20 h-20 rounded-md object-cover">
                                        <div>
                                            <p class="font-semibold text-gray-900">Protective Case</p>
                                            <p class="text-sm text-gray-500">Silicone</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4 font-semibold">$29.99</td>
                                <td class="p-4">
                                    <input type="number" value="1" min="1" class="quantity-input rounded-md p-2">
                                </td>
                                <td class="p-4 font-semibold">$29.99</td>
                                <td class="p-4">
                                    <button class="text-gray-400 hover:text-red-500">&times;</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Order Summary (Right) -->
            <aside class="w-full lg:w-1/3">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">Order Summary</h2>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Subtotal</span>
                            <span class="font-semibold">$428.99</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Shipping</span>
                            <span class="font-semibold">Free</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Tax</span>
                            <span class="font-semibold">$21.45</span>
                        </div>
                        <div class="border-t border-gray-200 pt-4 mt-4 flex justify-between">
                            <span class="text-xl font-bold text-gray-900">Order Total</span>
                            <span class="text-xl font-bold text-gray-900">$450.44</span>
                        </div>
                    </div>
                    
                    <button class="checkout-button w-full text-white font-bold py-3 px-6 rounded-lg text-lg shadow-lg mt-8">
                        Proceed to Checkout
                    </button>
                </div>
            </aside>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 border-t border-gray-200 mt-12">
        <div class="container mx-auto px-6 py-8 text-center text-gray-500">
            &copy; 2025 ShopCart. All rights reserved.
        </div>
    </footer>
</body>
</html>
