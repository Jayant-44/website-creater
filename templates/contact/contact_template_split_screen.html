<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Split Screen</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Custom CSS for a creative split-screen contact page */
        body {
            font-family: 'Inter', sans-serif;
            color: #333;
        }
        
        h1, h2, h3, h4, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        :root {
            --brand-color: #4f46e5; /* Indigo */
            --brand-color-dark: #4338ca;
        }

        .hero-bg {
            background-color: var(--brand-color);
            background-image: linear-gradient(135deg, var(--brand-color) 0%, var(--brand-color-dark) 100%), url('https://placehold.co/800x1200/4f46e5/ffffff?text=Let%27s+Talk&font=playfair');
            background-blend-mode: multiply;
            background-size: cover;
            background-position: center;
        }
        
        .form-input {
            border: 1px solid #d1d5db;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .submit-button {
            background-color: var(--brand-color);
            transition: all 0.3s ease;
        }
        .submit-button:hover {
            background-color: var(--brand-color-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body>

    <!-- Main Content Grid -->
    <div class="min-h-screen flex">
        
        <!-- Left Side (Info & Image) -->
        <div class="hidden lg:block lg:w-1/2 hero-bg">
            <div class="flex flex-col justify-between h-full p-12 text-white">
                <div class="text-2xl font-serif font-bold">YourBrand</div>
                <div class="max-w-md">
                    <h1 class="text-5xl font-bold mb-6">Let's build something great together.</h1>
                    <p class="text-lg text-indigo-100 leading-relaxed">
                        We're always excited to hear about new projects and ideas. Drop us a line, and we'll get back to you as soon as possible.
                    </p>
                </div>
                <div class="text-indigo-200 text-sm">
                    &copy; 2025 YourBrand. All rights reserved.
                </div>
            </div>
        </div>
        
        <!-- Right Side (Form) -->
        <div class="w-full lg:w-1/2 bg-white flex items-center justify-center p-8 md:p-12">
            <div class="w-full max-w-md">
                <h2 class="text-3xl font-bold text-gray-900 mb-8">Send Us a Message</h2>
                <form action="#" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="first-name" class="block text-sm font-medium text-gray-700">First Name</label>
                            <input type="text" id="first-name" name="first-name"
                                   class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                   required>
                        </div>
                        <div>
                            <label for="last-name" class="block text-sm font-medium text-gray-700">Last Name</label>
                            <input type="text" id="last-name" name="last-name"
                                   class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                   required>
                        </div>
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="email" name="email"
                               class="form-input mt-1 block w-full rounded-md px-4 py-3"
                               placeholder="you@example.com" required>
                    </div>
                    
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" name="subject"
                               class="form-input mt-1 block w-full rounded-md px-4 py-3"
                               placeholder="Regarding our new project" required>
                    </div>

                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                        <textarea id="message" name="message" rows="5"
                                  class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                  placeholder="Your message..." required></textarea>
                    </div>

                    <div>
                        <button type="submit"
                                class="submit-button w-full text-white font-bold py-3 px-6 rounded-lg shadow-lg">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
