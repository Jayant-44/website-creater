<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Minimal</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom CSS for a clean, minimal contact form */
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f4f5; /* Zinc 100 */
            color: #18181b; /* Zinc 900 */
        }
        
        .form-container {
            transition: all 0.3s ease;
        }

        .form-container:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.07), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
        }
        
        .form-input {
            background-color: #f4f4f5;
            border: 1px solid #d4d4d8;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            background-color: #fff;
            border-color: #18181b;
            box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.1);
            outline: none;
        }
        
        .submit-button {
            background-color: #18181b;
            color: #fff;
            transition: all 0.3s ease;
        }
        .submit-button:hover {
            background-color: #3f3f46;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(24, 24, 27, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg p-8 md:p-12 bg-white rounded-lg shadow-xl form-container m-4">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-900">Contact</h1>
            <p class="text-gray-600 mt-3">
                Questions or comments? Just drop us a line.
            </p>
        </div>

        <!-- Signup Form -->
        <form action="#" method="POST" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" name="name"
                       class="form-input mt-1 block w-full rounded-md px-4 py-3"
                       required>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email"
                       class="form-input mt-1 block w-full rounded-md px-4 py-3"
                       required>
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                <textarea id="message" name="message" rows="5"
                          class="form-input mt-1 block w-full rounded-md px-4 py-3"
                          required></textarea>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit"
                        class="submit-button w-full text-white font-bold py-3 px-4 rounded-md shadow-lg">
                    Send Message
                </button>
            </div>
        </form>
    </div>

</body>
</html>
