<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Template - App Download</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .preview-body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes footer to the bottom */
        }
        .app-store-button {
            display: inline-flex;
            align-items: center;
            background-color: #1f2937; /* bg-gray-800 */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .app-store-button:hover {
            background-color: #000;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .app-store-button svg {
            width: 30px;
            height: 30px;
            margin-right: 0.75rem;
        }
        .app-store-button .store-text {
            font-size: 0.75rem;
            line-height: 1.2;
            text-align: left;
        }
        .app-store-button .store-name {
            font-size: 1.125rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="preview-body">

    <!-- 
      ============================================================
      APP DOWNLOAD FOOTER
      Your Flask app can grab this <footer ...> ... </footer> block.
      ============================================================
    -->
    <footer class="bg-white text-gray-800 border-t border-gray-200">
        <div class="container mx-auto px-6 py-16">
            
            <!-- Main CTA Section -->
            <div class="text-center max-w-2xl mx-auto mb-12">
                <h2 class="text-4xl font-extrabold text-gray-900 mb-4">Get the App</h2>
                <p class="text-lg text-gray-600 mb-8">
                    Take your projects on the go. Download our mobile app for free and stay in sync with your team, wherever you are.
                </p>
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <!-- App Store Button -->
                    <a href="#" class="app-store-button">
                        <svg fill="currentColor" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C39.2 141.1 0 182.6 0 240.4c0 32.1 10.8 63.3 29.4 89.6 21.2 30.6 53.6 77.4 97.4 77.4 27.9 0 47.9-18.1 76.4-18.1 27.7 0 49.4 18.1 76.4 18.1 43.8 0 76.2-46.7 97.4-77.4 18.6-26.3 29.4-57.5 29.4-89.6 0-2.1 0-4.2-.1-6.3zM256.4 49.3c-23.7 0-44.4 13.9-54.8 33.5-12.7-21.6-35.3-33.5-56.8-33.5-24.9 0-48.7 14.7-61.7 36.8-13.9 23.3-22.1 51.9-22.1 82.3 0 52.8 28.2 87.7 59.8 119.5 15.6 15.6 34.6 30.6 57.6 30.6 22.1 0 35.8-14.7 54.8-14.7 18.1 0 32.8 14.7 54.8 14.7 23 0 42-15 57.6-30.6 31.6-31.8 59.8-66.7 59.8-119.5 0-30.3-8.2-59-22.1-82.3-13-22.1-36.8-36.8-61.7-36.8z"></path></svg>
                        <div>
                            <span class="store-text">Download on the</span>
                            <span class="store-name">App Store</span>
                        </div>
                    </a>
                    <!-- Google Play Button -->
                    <a href="#" class="app-store-button">
                        <svg fill="currentColor" viewBox="0 0 512 512"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"></path></svg>
                        <div>
                            <span class="store-text">GET IT ON</span>
                            <span class="store-name">Google Play</span>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Bottom Links & Copyright -->
            <div class="border-t border-gray-200 pt-8 mt-12 flex flex-col md:flex-row justify-between items-center text-sm">
                <p class="text-gray-500 order-2 md:order-1 mt-4 md:mt-0">&copy; 2025 Your App Inc. All rights reserved.</p>
                <nav class="flex space-x-6 order-1 md:order-2">
                    <a href="#" class="text-gray-500 hover:text-gray-900">Privacy</a>
                    <a href="#" class="text-gray-500 hover:text-gray-900">Terms</a>
                    <a href="#" class="text-gray-500 hover:text-gray-900">Support</a>
                </nav>
            </div>
        </div>
    </footer>

</body>
</html>
