<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Template - Newsletter Signup</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .preview-body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes footer to the bottom */
        }
        .newsletter-input {
            background-color: #374151; /* bg-gray-700 */
            border: 1px solid #4b5563; /* border-gray-600 */
            color: #d1d5db; /* text-gray-300 */
            transition: all 0.3s ease;
        }
        .newsletter-input:focus {
            border-color: #3b82f6; /* border-blue-500 */
            background-color: #4b5563;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .subscribe-button {
            background-color: #3b82f6; /* bg-blue-600 */
            transition: background-color 0.3s ease;
        }
        .subscribe-button:hover {
            background-color: #2563eb; /* bg-blue-700 */
        }
    </style>
</head>
<body class="preview-body">

    <!-- 
      ============================================================
      NEWSLETTER SIGNUP FOOTER
      Your Flask app can grab this <footer ...> ... </footer> block.
      ============================================================
    -->
    <footer class="bg-gray-800 text-gray-400">
        <div class="container mx-auto px-6 py-16">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                
                <!-- Column 1: Newsletter Signup -->
                <div class="md:col-span-2">
                    <h3 class="text-2xl font-bold text-white mb-4">Subscribe to our Newsletter</h3>
                    <p class="text-gray-400 mb-6">
                        Get the latest news, articles, and resources sent straight to your inbox. No spam, we promise.
                    </p>
                    <form action="#" method="POST" class="flex flex-col sm:flex-row gap-4">
                        <input 
                            type="email" 
                            placeholder="Enter your email" 
                            class="newsletter-input w-full px-4 py-3 rounded-md focus:outline-none" 
                            required>
                        <button 
                            type="submit" 
                            class="subscribe-button text-white font-semibold py-3 px-6 rounded-md">
                            Subscribe
                        </button>
                    </form>
                </div>
                
                <!-- Column 2: Quick Links -->
                <div class="md:col-span-1 md:text-right">
                    <h3 class="text-lg font-semibold text-white uppercase mb-4">Quick Links</h3>
                    <ul class="space-y-3">
                        <li><a href="#" class="hover:text-white">About Us</a></li>
                        <li><a href="#" class="hover:text-white">Contact</a></li>
                        <li><a href="#" class="hover:text-white">FAQ</a></li>
                        <li><a href="#" class="hover:text-white">Support</a></li>
                    </ul>
                </div>

            </div>
            
            <!-- Bottom Bar: Socials & Copyright -->
            <div class="border-t border-gray-700 mt-12 pt-8 flex flex-col md:flex-row justify-between items-center">
                <div class="flex space-x-6">
                    <!-- Facebook -->
                    <a href="#" class="hover:text-white">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.772-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
                    </a>
                    <!-- Instagram -->
                    <a href="#" class="hover:text-white">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.172.053 1.905.328 2.618.622.75.295 1.28.69 1.838 1.24.56.548.95 1.088 1.24 1.838.295.713.57 1.445.622 2.618.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.053 1.172-.328 1.905-.622 2.618-.295.75-.69 1.28-1.24 1.838-.548.56-1.088.95-1.838 1.24-.713.295-1.445.57-2.618.622-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.172-.053-1.905-.328-2.618-.622-.75-.295-1.28-.69-1.838-1.24-.56-.548-.95-1.088-1.24-1.838-.295-.713-.57-1.445-.622-2.618-.058-1.266-.07-1.646-.07-4.85s.012-3.584.07-4.85c.053-1.172.328 1.905.622 2.618.295-.75.69-1.28 1.24-1.838.548-.56 1.088-.95 1.838-1.24.713-.295 1.445-.57 2.618-.622 1.266-.058 1.646-.07 4.85-.07zM12 0C8.741 0 8.333.014 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.936 3.351.63 4.14C.333 4.905.131 5.775.072 7.053.014 8.333 0 8.741 0 12s.014 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.667 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.986 8.741 24 12 24s3.667-.014 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.717 2.126-1.384.667-.667 1.079-1.336 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.277.072-1.685.072-4.947s-.014-3.667-.072-4.947c-.06-1.277-.262-2.148-.558-2.913-.306-.789-.717-1.459-1.384-2.126C21.319.936 20.651.524 19.86.218 19.095.06 18.225.06 16.947.072 15.667.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"></path></svg>
                    </a>
                    <!-- LinkedIn -->
                    <a href="#" class="hover:text-white">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14zm-11 6H5v10h3V9zM6.5 7.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM19 19H16v-5.17c0-1.33-.03-3.04-1.85-3.04C12.34 10.79 12 12.16 12 13.83V19h-3V9h2.88v1.36h.04c.42-.79 1.44-1.64 2.84-1.64 3.03 0 3.59 1.99 3.59 4.58V19z"></path></svg>
                    </a>
                </div>
                <p class="text-sm text-gray-500 mt-4 md:mt-0">&copy; 2025 YourBrand. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
