<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Template - Local Business</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .preview-body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes footer to the bottom */
        }
        
        h1, h2, h3, h4, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        :root {
            --brand-color: #b45309; /* Amber/Brown */
        }
        
        .footer-link {
            transition: color 0.3s ease;
        }
        .footer-link:hover {
            color: var(--brand-color);
        }
        
        .map-placeholder {
            background-color: #e5e7eb;
            background-image: url('https://placehold.co/600x400/e5e7eb/6b7280?text=Our+Location&font=inter');
            background-size: cover;
            background-position: center;
            min-height: 300px;
        }
    </style>
</head>
<body class="preview-body">

    <!-- 
      ============================================================
      LOCAL BUSINESS FOOTER (WITH MAP)
      Your Flask app can grab this <footer ...> ... </footer> block.
      ============================================================
    -->
    <footer class="bg-gray-100 text-gray-700 border-t border-gray-200">
        <div class="grid grid-cols-1 md:grid-cols-2">
            
            <!-- Column 1: Info & Hours -->
            <div class="p-12 md:p-16">
                <h2 class="font-serif text-3xl font-bold text-gray-900 mb-6">Visit Us</h2>
                
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">Address</h3>
                        <p class="text-lg">
                            123 Main Street<br>
                            Brooklyn, NY 11201
                        </p>
                    </div>
                    
                    <div>
                        <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">Contact</h3>
                        <p><a href="tel:555-123-4567" class="text-lg footer-link hover:text-amber-700">(555) 123-4567</a></p>
                        <p><a href="mailto:contact@ourshop.com" class="text-lg footer-link hover:text-amber-700">contact@ourshop.com</a></p>
                    </div>

                    <div>
                        <h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">Hours</h3>
                        <div class="grid grid-cols-2 text-lg">
                            <div>
                                <p>Mon – Fri</p>
                                <p>Saturday</p>
                                <p>Sunday</p>
                            </div>
                            <div class="font-medium text-gray-900">
                                <p>10am – 8pm</p>
                                <p>11am – 7pm</p>
                                <p>Closed</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Column 2: Map -->
            <div class="map-placeholder">
                <!-- This div is styled as a map placeholder via CSS -->
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bg-gray-200 py-6">
            <div class="container mx-auto px-6 text-center text-gray-500 text-sm">
                &copy; 2025 Our Local Shop. All Rights Reserved.
            </div>
        </div>
    </footer>

</body>
</html>
