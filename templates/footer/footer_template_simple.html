<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Template - Simple Centered</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* This page is just a preview, so we add a light background 
           to contrast with the footer. */
        .preview-body {
            background-color: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes footer to the bottom */
        }
        .footer-link {
            color: #4b5563; /* text-gray-600 */
            transition: color 0.3s ease;
        }
        .footer-link:hover {
            color: #1d4ed8; /* text-blue-700 */
        }
        .social-icon {
            color: #6b7280; /* text-gray-500 */
            transition: color 0.3s ease;
        }
        .social-icon:hover {
            color: #1f2937; /* text-gray-800 */
        }
    </style>
</head>
<body class="preview-body">

    <!-- 
      ============================================================
      SIMPLE CENTERED FOOTER
      Your Flask app can grab this <footer ...> ... </footer> block.
      ============================================================
    -->

            <div class="flex flex-col items-center">

                <div class="text-3xl font-bold text-blue-700 mb-4">
                    BrandName

                    <a href="#" class="footer-link font-medium">Services</a>
                    <a href="#" class="footer-link font-medium">Portfolio</a>
                    <a href="#" class="footer-link font-medium">Contact</a>

</html>
