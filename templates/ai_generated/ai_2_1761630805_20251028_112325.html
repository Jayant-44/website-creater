<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFans - Create Your Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a, #333333); /* Dark, sleek gradient */
            overflow: hidden;
            color: #f0f0f0;
        }

        .container {
            display: flex;
            width: 800px;
            height: 550px; /* Slightly taller for more fields */
            background: rgba(0, 0, 0, 0.6); /* Darker, more transparent */
            backdrop-filter: blur(8px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 68, 0, 0.5); /* Subtle orange glow */
            position: relative;
        }

        .form-side {
            flex: 1;
            padding: 50px;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s ease-in-out;
        }

        .form-side h2 {
            font-family: 'Poppins', sans-serif;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff4400; /* OnlyFans orange */
            text-shadow: 2px 2px #ff8800; /* Lighter orange for shadow */
        }

        .form-side form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .form-side input:not([type="checkbox"]) {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            color: #f0f0f0;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-side input:not([type="checkbox"])::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-side input:not([type="checkbox"]):focus {
            outline: none;
            border-color: #ff4400;
            box-shadow: 0 0 8px rgba(255, 68, 0, 0.6);
        }

        .terms-checkbox {
            display: flex;
            align-items: center;
            margin: 15px 0 25px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .terms-checkbox input[type="checkbox"] {
            margin-right: 10px;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ff4400;
            border-radius: 4px;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .terms-checkbox input[type="checkbox"]:checked {
            background-color: #ff4400;
            border-color: #ff4400;
        }

        .terms-checkbox input[type="checkbox"]:checked::before {
            content: "\f00c"; /* FontAwesome check icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #fff;
            font-size: 12px;
        }

        .terms-checkbox a {
            color: #ff8800;
            text-decoration: none;
            margin-left: 5px;
            transition: color 0.3s ease;
        }

        .terms-checkbox a:hover {
            color: #ff4400;
            text-decoration: underline;
        }

        .form-side button {
            background: #ff4400; /* OnlyFans orange */
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 45px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-side button:hover {
            background: #e63d00; /* Darker orange on hover */
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 0, 0.4);
        }

        .social-login-text {
            margin: 20px 0 15px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-login button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: #f0f0f0;
            padding: 10px 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .social-login button i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .social-login button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ff4400;
            transform: translateY(-2px);
        }

        .social-login button.google {
            background: rgba(221, 75, 57, 0.2);
            border-color: rgba(221, 75, 57, 0.5);
        }
        .social-login button.google:hover {
            background: rgba(221, 75, 57, 0.3);
            border-color: #dd4b39;
        }

        .social-login button.twitter {
            background: rgba(29, 161, 242, 0.2);
            border-color: rgba(29, 161, 242, 0.5);
        }
        .social-login button.twitter:hover {
            background: rgba(29, 161, 242, 0.3);
            border-color: #1da1f2;
        }

        .overlay-side {
            flex: 1;
            background: linear-gradient(135deg, #ff4400, #ff8800); /* OnlyFans gradient */
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .overlay-side h2 {
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
            font-size: 2.2rem;
            color: #fff;
            text-shadow: none;
            letter-spacing: 1px;
        }

        .overlay-side p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .overlay-side button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            padding: 12px 40px;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .overlay-side button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-side">
            <h2>Create Your OnlyFans Account</h2>
            <form id="sign-up-form">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></label>
                </div>
                <button type="submit">Sign Up</button>
            </form>

            <p class="social-login-text">or sign up with</p>
            <div class="social-login">
                <button class="google"><i class="fab fa-google"></i> Google</button>
                <button class="twitter"><i class="fab fa-twitter"></i> Twitter</button>
            </div>
        </div>

        <div class="overlay-side">
            <h2>Welcome to OnlyFans!</h2>
            <p>Connect with your favorite creators and discover exclusive content. Join our community today!</p>
            <button onclick="window.location.href='login.html'">Already a Member? Sign In</button>
        </div>
    </div>
</body>
</html>
