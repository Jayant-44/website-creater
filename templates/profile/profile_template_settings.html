<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Settings</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom CSS for a clean settings/form page */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        :root {
            --brand-color: #059669; /* Emerald Green */
            --brand-color-dark: #047857;
        }
        
        .form-input {
            border: 1px solid #d1d5db;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }
        
        .submit-button {
            background-color: var(--brand-color);
            transition: all 0.3s ease;
        }
        .submit-button:hover {
            background-color: var(--brand-color-dark);
        }
        
        .tab-button {
            position: relative;
            padding-bottom: 0.5rem;
            color: #6b7280;
            transition: color 0.3s ease;
        }
        .tab-button.active {
            color: var(--brand-color);
        }
        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--brand-color);
        }
        .tab-button:hover {
            color: #111827;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold" style="color: var(--brand-color);">Settings</div>
            <a href="#" class="text-sm font-medium text-gray-600 hover:text-gray-900">&larr; Back to Dashboard</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-12 max-w-4xl">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Account Settings</h1>
        
        <div class="bg-white rounded-lg shadow-xl">
            <!-- Tabs (using simple placeholders, no JS for this template) -->
            <div class="border-b border-gray-200">
                <nav class="flex space-x-8 px-8 -mb-px">
                    <button class="tab-button active font-semibold py-4">
                        Profile
                    </button>
                    <button class="tab-button font-semibold py-4">
                        Password
                    </button>
                    <button class="tab-button font-semibold py-4">
                        Notifications
                    </button>
                </nav>
            </div>
            
            <!-- Form Content -->
            <div class="p-8">
                <form action="#" method="POST" class="space-y-6">
                    
                    <!-- Profile Picture Section -->
                    <div class="flex items-center space-x-6">
                        <img src="https://placehold.co/100x100/d1fae5/059669?text=JD&font=inter" alt="Profile Picture" class="w-20 h-20 rounded-full">
                        <div>
                            <button type="button" class="font-semibold py-2 px-4 rounded-md border border-gray-300 hover:bg-gray-50 text-sm">
                                Change Picture
                            </button>
                            <p class="text-xs text-gray-500 mt-2">JPG, GIF or PNG. 1MB max.</p>
                        </div>
                    </div>
                    
                    <!-- Form Fields -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="first-name" class="block text-sm font-medium text-gray-700">First Name</label>
                            <input type="text" id="first-name" name="first-name"
                                   class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                   value="Jane" required>
                        </div>
                        <div>
                            <label for="last-name" class="block text-sm font-medium text-gray-700">Last Name</label>
                            <input type="text" id="last-name" name="last-name"
                                   class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                   value="Doe" required>
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="email" name="email"
                               class="form-input mt-1 block w-full rounded-md px-4 py-3"
                               value="jane.doe@example.com" required>
                    </div>

                    <div>
                        <label for="bio" class="block text-sm font-medium text-gray-700">Your Bio</label>
                        <textarea id="bio" name="bio" rows="4"
                                  class="form-input mt-1 block w-full rounded-md px-4 py-3"
                                  placeholder="Tell us a little about yourself..."></textarea>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="pt-6 border-t border-gray-200 flex justify-end space-x-4">
                        <button type="button" class="font-semibold py-2 px-6 rounded-md border border-gray-300 hover:bg-gray-50">
                            Cancel
                        </button>
                        <button type="submit" class="submit-button text-white font-semibold py-2 px-6 rounded-md">
                            Save Changes
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>
    </main>

</body>
</html>
