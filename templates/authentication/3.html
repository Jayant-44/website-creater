<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Template 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚜 Farmer's Authentication</h1>
        <p>Welcome to your agricultural authentication solution!</p>
        <div class="feature-list">
            <h3>🌱 Features:</h3>
            <ul style="text-align:left; display:inline-block; margin-top:10px;">
                <li>Farm management tools</li>
                <li>Crop monitoring</li>
                <li>Weather integration</li>
                <li>Market prices</li>
                <li>Expert advice</li>
            </ul>
        </div>
        <p><strong>Designed specifically for modern farmers</strong></p>
    </div>
</body>
</html>
