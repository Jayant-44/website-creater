services:
  - type: web
    name: webbuddy
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webbuddy_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SITE_URL
        value: https://www.webbuddy.co.in
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: webbuddy-db
          property: connectionString